name: Build ISO

on:
  workflow_dispatch:
    inputs:
      spec:
        description: "JSON OS specification"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Nexivara ISO
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debootstrap \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            qemu-system-x86 \
            python3 \
            python3-pip \
            git

      - name: Download AI OS Builder
        run: |
          git clone --depth 1 \
            https://github.com/puzzleboxsoftworks/ai-os-builder.git \
            /tmp/ai-os-builder

      - name: Install AI OS Builder
        run: |
          cd /tmp/ai-os-builder
          python3 -m pip install --break-system-packages -e .

      - name: Write OS specification
        env:
          SPEC_JSON: ${{ inputs.spec }}
        run: |
          printf '%s' "$SPEC_JSON" > spec.json
          python3 -m json.tool spec.json > /dev/null
          echo "Specification is valid JSON."

      - name: Build ISO
        run: |
          sudo aios build spec.json -o nexivara-os.iso

      - name: Verify ISO
        run: |
          ls -lh nexivara-os.iso
          file nexivara-os.iso

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: nexivara-os
          path: nexivara-os.iso
          retention-days: 7
